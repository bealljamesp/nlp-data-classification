[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "nlp-data-classification"
version = "0.1.0"
description = "Automated text-mining and compliance classification pipeline with vectorized C-array operations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Quantitative Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.3.0",
    "pydantic>=2.6.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "W"]
ignore = [
    "N803", # Argument name should be lowercase (allows uppercase X for matrices)
    "N806"  # Variable in function should be lowercase (allows uppercase X_train/X_val)
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]